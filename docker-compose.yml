services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: seo
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./api
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      DB_NAME: seo
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-change-me}
      INTEL_URL: http://intel:8000
      WEB_ORIGIN: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:4000/google/callback
      ENC_KEY: ${ENC_KEY:-}
    ports: ["4000:4000"]
    depends_on:
      mysql: {condition: service_healthy}

  intel:
    build: ./intel
    environment:
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-change-me}
      API_URL: http://api:4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    ports: ["8000:8000"]

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mysql_data:
