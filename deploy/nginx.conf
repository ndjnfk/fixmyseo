# FixMySEO ko trustrideser.com/fixmyseo par chalane ke liye.
# Server par: /etc/nginx/snippets/fixmyseo.conf
# TrustRide ke `server { ... }` block (jisme `listen 443 ssl` hai) ke andar, baaki `location` se upar:
#     include snippets/fixmyseo.conf;
# Is file ko sites-enabled/ mein MAT rakhna: isme sirf location blocks hain, server block nahi.
#
#   https://trustrideser.com/fixmyseo/      -> web (Next.js, port 3100)
#   https://trustrideser.com/fixmyseo/api/  -> api (Express, port 4100), "/fixmyseo/api" hata ke
#
# `^~` zaroori hai: isse TrustRide config ke regex locations (jaise `~ \.php$` ya `~* \.(js|css)$`)
# in URLs ko nahi pakadte.

location ^~ /fixmyseo/api/ {
    proxy_pass http://127.0.0.1:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # keyword research aur GSC sync lambe chal sakte hain
    proxy_read_timeout 300s;
    client_max_body_size 10m;
}

location ^~ /fixmyseo/_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location ^~ /fixmyseo {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
